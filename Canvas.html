<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0d12;
      --panel: #11141b;
      --panel-2: #171a22;
      --border: #272b35;
      --text: #f5f7fa;
      --muted: #8b93a3;
      --accent: #7c5cff;
      --accent-soft: rgba(124, 92, 255, 0.15);
      --canvas: #ffffff;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
    }

    /* ================= TOP BAR ================= */

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(17, 20, 27, 0.95);
      position: relative;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 220px;
    }

    .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #7c5cff, #4f8cff);
      box-shadow: 0 8px 25px rgba(124, 92, 255, 0.3);
      font-size: 17px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
    }

    .document-name {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .top-actions {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .top-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: transparent;
      color: #aab1bf;
      cursor: pointer;
      font-size: 17px;
      transition: 0.2s;
    }

    .top-btn:hover {
      background: var(--panel-2);
      color: white;
    }

    .top-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .right-actions {
      min-width: 220px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 9px;
    }

    .secondary-btn,
    .primary-btn {
      height: 38px;
      padding: 0 15px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .secondary-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
    }

    .primary-btn {
      background: var(--accent);
      box-shadow: 0 6px 20px rgba(124, 92, 255, 0.25);
    }

    .primary-btn:hover {
      filter: brightness(1.1);
    }

    /* ================= MAIN ================= */

    .app {
      height: calc(100vh - 64px);
      display: flex;
    }

    /* ================= LEFT TOOLBAR ================= */

    .sidebar {
      width: 76px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 9px;
      gap: 7px;
      z-index: 5;
    }

    .tool {
      width: 54px;
      height: 48px;
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      background: transparent;
      color: #929aaa;
      cursor: pointer;
      transition: 0.18s;
      position: relative;
    }

    .tool:hover {
      background: var(--panel-2);
      color: white;
    }

    .tool.active {
      background: var(--accent-soft);
      color: #a994ff;
    }

    .tool.active::before {
      content: "";
      position: absolute;
      left: -9px;
      width: 3px;
      height: 24px;
      border-radius: 0 4px 4px 0;
      background: var(--accent);
    }

    .tool-icon {
      font-size: 17px;
      line-height: 18px;
    }

    .tool-label {
      font-size: 9px;
    }

    .divider {
      width: 42px;
      height: 1px;
      background: var(--border);
      margin: 5px 0;
    }

    /* ================= WORKSPACE ================= */

    .workspace {
      flex: 1;
      min-width: 0;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(124, 92, 255, 0.08),
          transparent 35%
        ),
        #0d1016;
    }

    .canvas-area {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 70px 300px 100px 80px;
    }

    .canvas-wrapper {
      position: relative;
      flex-shrink: 0;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        0 5px 20px rgba(0, 0, 0, 0.25);
    }

    #canvas {
      display: block;
      background: white;
      cursor: crosshair;
      border-radius: 2px;
    }

    /* ================= RIGHT PANEL ================= */

    .properties {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 250px;
      bottom: 70px;
      background: rgba(17, 20, 27, 0.94);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 17px;
      overflow-y: auto;
      backdrop-filter: blur(18px);
      z-index: 4;
    }

    .properties::-webkit-scrollbar {
      width: 4px;
    }

    .properties::-webkit-scrollbar-thumb {
      background: #343946;
      border-radius: 10px;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
    }

    .panel-subtitle {
      font-size: 10px;
      color: var(--muted);
    }

    .property {
      margin-bottom: 20px;
    }

    .property-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .property-label {
      font-size: 11px;
      color: #aab1bf;
    }

    .property-value {
      font-size: 11px;
      color: white;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* COLORS */

    .color-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .color-input {
      width: 43px;
      height: 43px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      background: var(--panel-2);
      cursor: pointer;
    }

    .color-value {
      flex: 1;
      height: 39px;
      border-radius: 9px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: white;
      padding: 0 10px;
      font-size: 12px;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    .swatch {
      width: 25px;
      height: 25px;
      border-radius: 7px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: 0.15s;
    }

    .swatch:hover {
      transform: scale(1.12);
    }

    .swatch.active {
      border-color: white;
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* BUTTON GROUP */

    .segmented {
      display: flex;
      gap: 5px;
    }

    .segment {
      flex: 1;
      height: 34px;
      border-radius: 7px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }

    .segment.active {
      background: var(--accent-soft);
      color: #b5a6ff;
      border-color: rgba(124, 92, 255, 0.35);
    }

    /* ================= BOTTOM BAR ================= */

    .bottom-bar {
      position: absolute;
      bottom: 14px;
      left: 92px;
      right: 284px;
      height: 48px;
      background: rgba(17, 20, 27, 0.95);
      border: 1px solid var(--border);
      border-radius: 13px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 14px;
      backdrop-filter: blur(15px);
      z-index: 6;
    }

    .bottom-group {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .bottom-label {
      font-size: 10px;
      color: var(--muted);
    }

    .color-preview {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      border: 1px solid #4b5160;
    }

    .separator {
      width: 1px;
      height: 25px;
      background: var(--border);
    }

    .zoom-value {
      min-width: 45px;
      text-align: center;
      font-size: 11px;
      color: #c5cad3;
    }

    .zoom-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: var(--panel-2);
      cursor: pointer;
      color: #aaa;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 900px) {
      .properties {
        display: none;
      }

      .canvas-area {
        padding: 60px 20px 90px;
      }

      .bottom-bar {
        left: 88px;
        right: 15px;
      }

      .brand {
        min-width: auto;
      }

      .brand-title,
      .document-name {
        display: none;
      }

      .right-actions {
        min-width: auto;
      }

      .secondary-btn {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 0 10px;
        gap: 8px;
      }

      .top-actions {
        display: none;
      }

      .sidebar {
        width: 62px;
      }

      .tool {
        width: 45px;
      }

      .bottom-bar {
        left: 72px;
        right: 10px;
        gap: 8px;
        overflow-x: auto;
      }

      .bottom-label {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- ================= TOP BAR ================= -->

  <header class="topbar">

    <div class="brand">
      <div class="logo">✦</div>

      <div>
        <div class="brand-title">Canvas Studio</div>
        <div class="document-name">Untitled Design</div>
      </div>
    </div>

    <div class="top-actions">

      <button class="top-btn" id="undoBtn" title="Undo">
        ↶
      </button>

      <button class="top-btn" id="redoBtn" title="Redo">
        ↷
      </button>

      <button class="top-btn" id="zoomOut" title="Zoom Out">
        −
      </button>

      <button class="top-btn" id="zoomIn" title="Zoom In">
        +
      </button>

      <button class="top-btn" id="resetZoom" title="Reset Zoom">
        ⛶
      </button>

    </div>

    <div class="right-actions">

      <button class="secondary-btn" id="clearBtn">
        Clear
      </button>

      <button class="primary-btn" id="downloadBtn">
        Export PNG
      </button>

    </div>

  </header>


  <!-- ================= APPLICATION ================= -->

  <main class="app">

    <!-- LEFT TOOLBAR -->

    <aside class="sidebar">

      <button class="tool active" data-tool="brush">
        <span class="tool-icon">🖌</span>
        <span class="tool-label">Brush</span>
      </button>

      <button class="tool" data-tool="pencil">
        <span class="tool-icon">✎</span>
        <span class="tool-label">Pencil</span>
      </button>

      <button class="tool" data-tool="eraser">
        <span class="tool-icon">⌫</span>
        <span class="tool-label">Eraser</span>
      </button>

      <div class="divider"></div>

      <button class="tool" data-tool="line">
        <span class="tool-icon">╱</span>
        <span class="tool-label">Line</span>
      </button>

      <button class="tool" data-tool="rectangle">
        <span class="tool-icon">□</span>
        <span class="tool-label">Rectangle</span>
      </button>

      <button class="tool" data-tool="circle">
        <span class="tool-icon">○</span>
        <span class="tool-label">Circle</span>
      </button>

      <button class="tool" data-tool="arrow">
        <span class="tool-icon">➜</span>
        <span class="tool-label">Arrow</span>
      </button>

      <div class="divider"></div>

      <button class="tool" data-tool="text">
        <span class="tool-icon">T</span>
        <span class="tool-label">Text</span>
      </button>

      <button class="tool" data-tool="fill">
        <span class="tool-icon">▰</span>
        <span class="tool-label">Fill</span>
      </button>

      <button class="tool" data-tool="picker">
        <span class="tool-icon">◉</span>
        <span class="tool-label">Picker</span>
      </button>

    </aside>


    <!-- ================= WORKSPACE ================= -->

    <section class="workspace">

      <div class="canvas-area">

        <div class="canvas-wrapper">

          <canvas
            id="canvas"
            width="900"
            height="600"
          ></canvas>

        </div>

      </div>


      <!-- ================= PROPERTIES ================= -->

      <aside class="properties">

        <div class="panel-heading">
          <div>
            <div class="panel-title">Properties</div>
            <div class="panel-subtitle">Tool settings</div>
          </div>
        </div>


        <div class="property">

          <div class="property-header">
            <span class="property-label">Color</span>
            <span class="property-value" id="colorText">
              #7C5CFF
            </span>
          </div>

          <div class="color-row">

            <input
              type="color"
              id="colorPicker"
              class="color-input"
              value="#7c5cff"
            />

            <input
              type="text"
              id="colorValue"
              class="color-value"
              value="#7C5CFF"
              maxlength="7"
            />

          </div>

          <div class="palette">

            <button class="swatch" style="background:#000000" data-color="#000000"></button>
            <button class="swatch" style="background:#ffffff" data-color="#ffffff"></button>
            <button class="swatch" style="background:#ff3b30" data-color="#ff3b30"></button>
            <button class="swatch" style="background:#ff9500" data-color="#ff9500"></button>
            <button class="swatch" style="background:#ffcc00" data-color="#ffcc00"></button>
            <button class="swatch" style="background:#34c759" data-color="#34c759"></button>
            <button class="swatch" style="background:#00c7be" data-color="#00c7be"></button>

            <button class="swatch" style="background:#007aff" data-color="#007aff"></button>
            <button class="swatch" style="background:#5856d6" data-color="#5856d6"></button>
            <button class="swatch" style="background:#af52de" data-color="#af52de"></button>
            <button class="swatch" style="background:#ff2d55" data-color="#ff2d55"></button>
            <button class="swatch" style="background:#7c5cff" data-color="#7c5cff"></button>
            <button class="swatch" style="background:#5e5ce6" data-color="#5e5ce6"></button>
            <button class="swatch" style="background:#8e8e93" data-color="#8e8e93"></button>

          </div>

        </div>


        <div class="property">

          <div class="property-header">
            <span class="property-label">Brush Size</span>
            <span class="property-value" id="sizeValue">
              8 px
            </span>
          </div>

          <input
            type="range"
            id="sizePicker"
            min="1"
            max="80"
            value="8"
          />

        </div>


        <div class="property">

          <div class="property-header">
            <span class="property-label">Opacity</span>
            <span class="property-value" id="opacityValue">
              100%
            </span>
          </div>

          <input
            type="range"
            id="opacityPicker"
            min="1"
            max="100"
            value="100"
          />

        </div>


        <div class="property">

          <div class="property-header">
            <span class="property-label">Style</span>
          </div>

          <div class="segmented">

            <button class="segment active" id="strokeBtn">
              Stroke
            </button>

            <button class="segment" id="fillBtn">
              Fill
            </button>

          </div>

        </div>


        <div class="property">

          <div class="property-header">
            <span class="property-label">Canvas</span>
          </div>

          <div class="segmented">

            <button class="segment active" id="whiteBg">
              White
            </button>

            <button class="segment" id="transparentBg">
              Transparent
            </button>

          </div>

        </div>

      </aside>


      <!-- ================= BOTTOM BAR ================= -->

      <div class="bottom-bar">

        <div class="bottom-group">
          <span class="bottom-label">Color</span>
          <div
            class="color-preview"
            id="colorPreview"
            style="background:#7c5cff"
          ></div>
        </div>

        <div class="separator"></div>

        <div class="bottom-group">

          <span class="bottom-label">Size</span>

          <input
            type="range"
            id="bottomSize"
            min="1"
            max="80"
            value="8"
            style="width:100px"
          />

        </div>

        <div class="separator"></div>

        <div class="bottom-group">

          <button class="zoom-btn" id="bottomZoomOut">
            −
          </button>

          <span class="zoom-value" id="zoomValue">
            100%
          </span>

          <button class="zoom-btn" id="bottomZoomIn">
            +
          </button>

        </div>

      </div>

    </section>

  </main>


  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const colorPicker = document.getElementById("colorPicker");
    const colorValue = document.getElementById("colorValue");
    const colorText = document.getElementById("colorText");
    const colorPreview = document.getElementById("colorPreview");

    const sizePicker = document.getElementById("sizePicker");
    const bottomSize = document.getElementById("bottomSize");
    const sizeValue = document.getElementById("sizeValue");

    const opacityPicker = document.getElementById("opacityPicker");
    const opacityValue = document.getElementById("opacityValue");

    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");

    let tool = "brush";
    let color = "#7c5cff";
    let brushSize = 8;
    let opacity = 1;
    let isDrawing = false;

    let startX = 0;
    let startY = 0;

    let zoom = 1;

    let history = [];
    let historyIndex = -1;

    let fillShape = false;

    /* ================= CANVAS ================= */

    function initializeCanvas() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      saveState();
    }

    initializeCanvas();


    /* ================= HISTORY ================= */

    function saveState() {
      if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
      }

      history.push(canvas.toDataURL());

      if (history.length > 30) {
        history.shift();
      }

      historyIndex = history.length - 1;

      updateHistoryButtons();
    }

    function restoreState(data) {
      const img = new Image();

      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);
      };

      img.src = data;
    }

    function undo() {
      if (historyIndex <= 0) return;

      historyIndex--;
      restoreState(history[historyIndex]);

      updateHistoryButtons();
    }

    function redo() {
      if (historyIndex >= history.length - 1) return;

      historyIndex++;
      restoreState(history[historyIndex]);

      updateHistoryButtons();
    }

    function updateHistoryButtons() {
      undoBtn.disabled = historyIndex <= 0;
      redoBtn.disabled = historyIndex >= history.length - 1;
    }

    undoBtn.addEventListener("click", undo);
    redoBtn.addEventListener("click", redo);


    /* ================= TOOLS ================= */

    document.querySelectorAll(".tool").forEach(button => {

      button.addEventListener("click", () => {

        document
          .querySelectorAll(".tool")
          .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        tool = button.dataset.tool;

        updateCursor();
      });

    });


    function updateCursor() {

      if (tool === "text") {
        canvas.style.cursor = "text";
      } else if (tool === "picker") {
        canvas.style.cursor = "crosshair";
      } else {
        canvas.style.cursor = "crosshair";
      }

    }


    /* ================= POSITION ================= */

    function getPosition(event) {

      const rect = canvas.getBoundingClientRect();

      return {
        x: (event.clientX - rect.left) * (canvas.width / rect.width),
        y: (event.clientY - rect.top) * (canvas.height / rect.height)
      };

    }


    /* ================= DRAWING ================= */

    canvas.addEventListener("pointerdown", event => {

      const pos = getPosition(event);

      startX = pos.x;
      startY = pos.y;

      if (tool === "picker") {

        const pixel = ctx.getImageData(
          Math.floor(pos.x),
          Math.floor(pos.y),
          1,
          1
        ).data;

        const picked = rgbToHex(pixel[0], pixel[1], pixel[2]);

        setColor(picked);

        return;
      }

      if (tool === "fill") {

        floodFill(
          Math.floor(pos.x),
          Math.floor(pos.y),
          hexToRgba(color)
        );

        saveState();

        return;
      }

      if (tool === "text") {

        const text = prompt("Enter text:");

        if (text) {

          ctx.save();

          ctx.globalAlpha = opacity;
          ctx.fillStyle = color;
          ctx.font = `${Math.max(16, brushSize * 3)}px Arial`;
          ctx.fillText(text, pos.x, pos.y);

          ctx.restore();

          saveState();

        }

        return;
      }

      isDrawing = true;

      ctx.beginPath();
      ctx.moveTo(startX, startY);

    });


    canvas.addEventListener("pointermove", event => {

      if (!isDrawing) return;

      const pos = getPosition(event);

      if (
        tool === "brush" ||
        tool === "pencil" ||
        tool === "eraser"
      ) {

        ctx.save();

        ctx.globalAlpha = opacity;

        ctx.lineWidth =
          tool === "pencil"
            ? Math.max(1, brushSize / 2)
            : brushSize;

        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        if (tool === "eraser") {

          ctx.globalCompositeOperation =
            "destination-out";

        } else {

          ctx.globalCompositeOperation =
            "source-over";

          ctx.strokeStyle = color;

        }

        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();

        ctx.restore();

      }

    });


    canvas.addEventListener("pointerup", event => {

      if (!isDrawing) return;

      const pos = getPosition(event);

      if (
        tool === "line" ||
        tool === "rectangle" ||
        tool === "circle" ||
        tool === "arrow"
      ) {

        redrawFromHistory();

        ctx.save();

        ctx.globalAlpha = opacity;
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.lineWidth = brushSize;

        if (fillShape) {
          ctx.fillStyle = color;
        }

        if (tool === "line") {

          drawLine(
            startX,
            startY,
            pos.x,
            pos.y
          );

        }

        if (tool === "rectangle") {

          const width = pos.x - startX;
          const height = pos.y - startY;

          if (fillShape) {
            ctx.fillRect(
              startX,
              startY,
              width,
              height
            );
          } else {
            ctx.strokeRect(
              startX,
              startY,
              width,
              height
            );
          }

        }

        if (tool === "circle") {

          const radius = Math.sqrt(
            Math.pow(pos.x - startX, 2) +
            Math.pow(pos.y - startY, 2)
          );

          ctx.beginPath();
          ctx.arc(
            startX,
            startY,
            radius,
            0,
            Math.PI * 2
          );

          if (fillShape) {
            ctx.fill();
          } else {
            ctx.stroke();
          }

        }

        if (tool === "arrow") {

          drawArrow(
            startX,
            startY,
            pos.x,
            pos.y
          );

        }

        ctx.restore();

      }

      isDrawing = false;

      if (
        tool === "brush" ||
        tool === "pencil" ||
        tool === "eraser" ||
        tool === "line" ||
        tool === "rectangle" ||
        tool === "circle" ||
        tool === "arrow"
      ) {
        saveState();
      }

      ctx.closePath();

    });


    canvas.addEventListener("pointerleave", () => {
      if (isDrawing) {
        isDrawing = false;
        saveState();
      }
    });


    /* ================= SHAPES ================= */

    function drawLine(x1, y1, x2, y2) {

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

    }


    function drawArrow(x1, y1, x2, y2) {

      const headLength = 16;

      const angle = Math.atan2(
        y2 - y1,
        x2 - x1
      );

      ctx.beginPath();

      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);

      ctx.lineTo(
        x2 - headLength * Math.cos(angle - Math.PI / 6),
        y2 - headLength * Math.sin(angle - Math.PI / 6)
      );

      ctx.moveTo(x2, y2);

      ctx.lineTo(
        x2 - headLength * Math.cos(angle + Math.PI / 6),
        y2 - headLength * Math.sin(angle + Math.PI / 6)
      );

      ctx.stroke();

    }


    function redrawFromHistory() {

      if (historyIndex < 0) return;

      const img = new Image();

      img.onload = () => {
        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.drawImage(img, 0, 0);
      };

      img.src = history[historyIndex];

    }


    /* ================= COLOR ================= */

    function setColor(newColor) {

      if (!/^#[0-9A-F]{6}$/i.test(newColor)) {
        return;
      }

      color = newColor.toLowerCase();

      colorPicker.value = color;
      colorValue.value = color.toUpperCase();
      colorText.textContent = color.toUpperCase();

      colorPreview.style.background = color;

      document
        .querySelectorAll(".swatch")
        .forEach(swatch => {
          swatch.classList.toggle(
            "active",
            swatch.dataset.color.toLowerCase() === color
          );
        });

    }


    colorPicker.addEventListener("input", event => {
      setColor(event.target.value);
    });


    colorValue.addEventListener("change", event => {

      let value = event.target.value.trim();

      if (!value.startsWith("#")) {
        value = "#" + value;
      }

      setColor(value);

    });


    document
      .querySelectorAll(".swatch")
      .forEach(swatch => {

        swatch.addEventListener("click", () => {
          setColor(swatch.dataset.color);
        });

      });


    /* ================= SIZE ================= */

    function setSize(value) {

      brushSize = Number(value);

      sizePicker.value = brushSize;
      bottomSize.value = brushSize;

      sizeValue.textContent =
        `${brushSize} px`;

    }


    sizePicker.addEventListener("input", event => {
      setSize(event.target.value);
    });


    bottomSize.addEventListener("input", event => {
      setSize(event.target.value);
    });


    /* ================= OPACITY ================= */

    opacityPicker.addEventListener("input", event => {

      opacity =
        Number(event.target.value) / 100;

      opacityValue.textContent =
        `${event.target.value}%`;

    });


    /* ================= FILL / STROKE ================= */

    document
      .getElementById("strokeBtn")
      .addEventListener("click", () => {

        fillShape = false;

        document
          .getElementById("strokeBtn")
          .classList.add("active");

        document
          .getElementById("fillBtn")
          .classList.remove("active");

      });


    document
      .getElementById("fillBtn")
      .addEventListener("click", () => {

        fillShape = true;

        document
          .getElementById("fillBtn")
          .classList.add("active");

        document
          .getElementById("strokeBtn")
          .classList.remove("active");

      });


    /* ================= CLEAR ================= */

    document
      .getElementById("clearBtn")
      .addEventListener("click", () => {

        if (!confirm("Clear the entire canvas?")) {
          return;
        }

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        saveState();

      });


    /* ================= DOWNLOAD ================= */

    document
      .getElementById("downloadBtn")
      .addEventListener("click", () => {

        const link =
          document.createElement("a");

        link.download =
          "canvas-studio.png";

        link.href =
          canvas.toDataURL("image/png");

        link.click();

      });


    /* ================= ZOOM ================= */

    function updateZoom() {

      const wrapper =
        document.querySelector(".canvas-wrapper");

      wrapper.style.transform =
        `scale(${zoom})`;

      document.getElementById("zoomValue")
        .textContent =
        `${Math.round(zoom * 100)}%`;

    }


    function zoomIn() {

      zoom = Math.min(
        2.5,
        zoom + 0.1
      );

      updateZoom();

    }


    function zoomOut() {

      zoom = Math.max(
        0.5,
        zoom - 0.1
      );

      updateZoom();

    }


    function resetZoom() {

      zoom = 1;

      updateZoom();

    }


    document
      .getElementById("zoomIn")
      .addEventListener("click", zoomIn);

    document
      .getElementById("bottomZoomIn")
      .addEventListener("click", zoomIn);

    document
      .getElementById("zoomOut")
      .addEventListener("click", zoomOut);

    document
      .getElementById("bottomZoomOut")
      .addEventListener("click", zoomOut);

    document
      .getElementById("resetZoom")
      .addEventListener("click", resetZoom);


    /* ================= KEYBOARD ================= */

    document.addEventListener("keydown", event => {

      if (
        event.ctrlKey &&
        event.key.toLowerCase() === "z"
      ) {

        event.preventDefault();

        if (event.shiftKey) {
          redo();
        } else {
          undo();
        }

      }

      if (
        event.ctrlKey &&
        event.key.toLowerCase() === "y"
      ) {

        event.preventDefault();

        redo();

      }

      if (event.key === "b") {
        selectTool("brush");
      }

      if (event.key === "p") {
        selectTool("pencil");
      }

      if (event.key === "e") {
        selectTool("eraser");
      }

      if (event.key === "l") {
        selectTool("line");
      }

    });


    function selectTool(name) {

      const button =
        document.querySelector(
          `.tool[data-tool="${name}"]`
        );

      if (button) {
        button.click();
      }

    }


    /* ================= FLOOD FILL ================= */

    function floodFill(startX, startY, fillColor) {

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data = imageData.data;

      const width = canvas.width;
      const height = canvas.height;

      const startIndex =
        (startY * width + startX) * 4;

      const targetColor = [
        data[startIndex],
        data[startIndex + 1],
        data[startIndex + 2],
        data[startIndex + 3]
      ];

      if (
        colorsMatch(
          targetColor,
          fillColor
        )
      ) {
        return;
      }

      const stack = [
        [startX, startY]
      ];

      while (stack.length) {

        const [x, y] = stack.pop();

        if (
          x < 0 ||
          y < 0 ||
          x >= width ||
          y >= height
        ) {
          continue;
        }

        const index =
          (y * width + x) * 4;

        const current = [
          data[index],
          data[index + 1],
          data[index + 2],
          data[index + 3]
        ];

        if (
          !colorsMatch(
            current,
            targetColor
          )
        ) {
          continue;
        }

        data[index] = fillColor[0];
        data[index + 1] = fillColor[1];
        data[index + 2] = fillColor[2];
        data[index + 3] = fillColor[3];

        stack.push([x + 1, y]);
        stack.push([x - 1, y]);
        stack.push([x, y + 1]);
        stack.push([x, y - 1]);

      }

      ctx.putImageData(
        imageData,
        0,
        0
      );

    }


    function colorsMatch(a, b) {

      return (
        a[0] === b[0] &&
        a[1] === b[1] &&
        a[2] === b[2] &&
        a[3] === b[3]
      );

    }


    function hexToRgba(hex) {

      const value =
        hex.replace("#", "");

      return [
        parseInt(value.substring(0, 2), 16),
        parseInt(value.substring(2, 4), 16),
        parseInt(value.substring(4, 6), 16),
        255
      ];

    }


    function rgbToHex(r, g, b) {

      return (
        "#" +
        [r, g, b]
          .map(value =>
            value.toString(16).padStart(2, "0")
          )
          .join("")
      );

    }


    /* Initial color */

    setColor("#7c5cff");

    updateHistoryButtons();
  </script>

</body>
